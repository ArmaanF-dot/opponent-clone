[project]
name = "opponent-clone"
version = "0.1.0"
description = "Fetch an opponent's games, split by time control, and build a style profile."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
opponent-clone = "opponent_clone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
